<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Carbon Footprint System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --light-green: #e8f8f5;
            --text-dark: #2c3e50;
        }
        body {
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            display: flex;
            min-height: 500px;
        }
        .auth-left {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=800&q=80') center/cover;
            position: relative;
            display: none;
        }
        @media (min-width: 768px) {
            .auth-left { display: block; }
        }
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(46, 204, 113, 0.8), rgba(39, 174, 96, 0.9));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .auth-right {
            flex: 1;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25);
            border-color: var(--primary-green);
        }
        .btn-success {
            background: var(--primary-green);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-success:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
        }
        .toggle-link {
            color: var(--dark-green);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .toggle-link:hover { text-decoration: underline; }
        .alert { display: none; border-radius: 10px; }
        .app-logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .app-tagline {
            font-size: 1.1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-overlay">
                <div class="app-logo"><i class="fas fa-leaf"></i> EcoTrack</div>
                <div class="app-tagline">Track your carbon footprint, discover eco-friendly alternatives, and make a real impact on our planet.</div>
            </div>
        </div>
        
        <div class="auth-right">
            <!-- Login Form -->
            <div id="loginFormContainer">
                <h3 class="mb-4 text-center fw-bold text-dark">Welcome Back</h3>
                <div id="loginAlert" class="alert alert-danger"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="loginEmail" required placeholder="Enter your email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-success mb-3"><i class="fas fa-sign-in-alt me-2"></i>Login to Dashboard</button>
                    <p class="text-center text-muted">Don't have an account? <span class="toggle-link" onclick="toggleForms()">Register here</span></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" style="display: none;">
                <h3 class="mb-4 text-center fw-bold text-dark">Create Account</h3>
                <div id="registerAlert" class="alert alert-danger"></div>
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="regName" required placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="regEmail" required placeholder="Enter your email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Password</label>
                        <input type="password" class="form-control" id="regPassword" required placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-success mb-3"><i class="fas fa-user-plus me-2"></i>Register</button>
                    <p class="text-center text-muted">Already have an account? <span class="toggle-link" onclick="toggleForms()">Login here</span></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            const login = document.getElementById('loginFormContainer');
            const register = document.getElementById('registerFormContainer');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                register.style.display = 'none';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('loginAlert');
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.message || 'Login failed';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Server error. Please try again.';
                alertBox.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const alertBox = document.getElementById('registerAlert');
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, password})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.message || 'Registration failed';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Server error. Please try again.';
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
